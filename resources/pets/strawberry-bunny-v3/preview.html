const descriptions={"idle":"沿用轻微呼吸和约每 4 秒一次的自然眨眼。","react":"肩膀放松、肘部靠近身体，用前臂和手腕小幅摆动；表情从注意到你，转为微笑招呼和放松。","celebrate":"由期待转为开心，第一次鼓掌时短暂闭眼，再睁眼继续庆祝，最后回到满足的微笑。","all_done":"蓄力时专注，起跳时惊喜，落地后开心；在欢呼中自然闭眼再展开。","remind":"从平静等待转为留意与邀请，在两次铃声之间眨眼，再恢复温和的提醒。","drink_water":"视线跟着杯子，喝水时抿嘴专注；放下杯子后眨眼，表情转为满足。","stretch":"抬手时专注，伸展时轻轻呼气，收尾时眨眼，回到放松的微笑。"};
const imageCache=new Map();
const after=document.getElementById('after').getContext('2d');
const faceAfter=document.getElementById('face-after').getContext('2d');
let selected=actions[0],image=null,playing=true,speed=1,elapsed=0,previous=0,selectionVersion=0;
function load(src){if(!imageCache.has(src))imageCache.set(src,new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(new Error('Cannot load '+src));image.src=src;}));return imageCache.get(src);}
for(const action of actions){const button=document.createElement('button');button.type='button';button.dataset.state=action.id;button.textContent=action.label;button.setAttribute('aria-pressed',String(action===selected));button.addEventListener('click',()=>chooseAction(action.id));document.getElementById('actions').append(button);}
async function chooseAction(id){
 const version=++selectionVersion;const action=actions.find(x=>x.id===id);if(!action)throw new Error('Unknown action');
 document.getElementById('status').textContent='正在载入图像…';
 const loaded=await load(action.state.src);
 if(version!==selectionVersion)return;
 selected=action;image=loaded;elapsed=0;
 document.getElementById('title').textContent=action.label;document.getElementById('blink').hidden=false;
 document.getElementById('description').textContent=descriptions[id];
 document.getElementById('new-note').textContent='循环 '+(action.state.frames/action.state.fps).toFixed(2)+' 秒 · 24 张绘制帧 / '+action.state.frames+' 张播放帧';
 document.getElementById('scrubber').max=String(action.state.frames-1);
 for(const button of document.querySelectorAll('[data-state]'))button.setAttribute('aria-pressed',String(button.dataset.state===id));
 document.getElementById('status').textContent='已载入 · 可用慢放和逐帧按钮检查';draw();
 return {id,after:[loaded.width,loaded.height],frames:action.state.frames};
}
function draw(){
 if(!image)return;const duration=selected.state.frames/selected.state.fps*1000;
 const position=((elapsed%duration)+duration)%duration;
 const index=Math.min(selected.state.frames-1,Math.floor(position*selected.state.fps/1000));
 after.clearRect(0,0,320,320);
 // Keep this display calibration in sync with src/shared/pet-proportions.ts.
 const tile=selected.state.frameIndices[index];
 const p=selected.state.proportions,sx=tile%selected.state.cols*320,sy=Math.floor(tile/selected.state.cols)*320;
 if(!p)after.drawImage(image,sx,sy,320,320,0,0,320,320);
 else{
  let {neckY,footY}=p;for(const [start,neck,foot] of p.poses||[]){if(start>index)break;neckY=neck;footY=foot;}
  const x=160*(1-p.headScale),width=320*p.headScale,neck=footY-(footY-neckY)*p.bodyScale;
  after.drawImage(image,sx,sy+neckY,320,320-neckY,x,neck,width,(320-neckY)*p.bodyScale);
  after.drawImage(image,sx,sy,320,neckY,x,neck-neckY*p.headScale,width,neckY*p.headScale);
 }
 faceAfter.clearRect(0,0,180,132);faceAfter.drawImage(after.canvas,105,75,110,80,0,0,180,132);
 document.getElementById('scrubber').value=String(index);
 document.getElementById('time').textContent=(position/1000).toFixed(2)+' / '+(duration/1000).toFixed(2)+' 秒';
 document.getElementById('frame-info').textContent='播放帧 '+(index+1)+' / '+selected.state.frames+' · 对应绘制帧 '+(selected.timeline[index]+1)+' / 24';
}
function setPlaying(value){playing=value;document.getElementById('play').textContent=value?'暂停':'播放';}
function seek(index){setPlaying(false);elapsed=Math.max(0,Math.min(selected.state.frames-1,index))/selected.state.fps*1000+0.01;draw();}
document.getElementById('play').addEventListener('click',()=>setPlaying(!playing));
document.getElementById('restart').addEventListener('click',()=>{elapsed=0;draw();});
document.getElementById('blink').addEventListener('click',()=>{seek(selected.timeline.indexOf(selected.blinkStart));speed=0.25;for(const button of document.querySelectorAll('[data-speed]'))button.setAttribute('aria-pressed',String(button.dataset.speed==='0.25'));setPlaying(true);});
document.getElementById('previous').addEventListener('click',()=>seek(Number(document.getElementById('scrubber').value)-1));
document.getElementById('next').addEventListener('click',()=>seek(Number(document.getElementById('scrubber').value)+1));
document.getElementById('scrubber').addEventListener('input',event=>seek(Number(event.target.value)));
for(const button of document.querySelectorAll('[data-speed]'))button.addEventListener('click',()=>{speed=Number(button.dataset.speed);for(const other of document.querySelectorAll('[data-speed]'))other.setAttribute('aria-pressed',String(other===button));});
for(const button of document.querySelectorAll('[data-bg]'))button.addEventListener('click',()=>{document.body.className=button.dataset.bg;for(const other of document.querySelectorAll('[data-bg]'))other.setAttribute('aria-pressed',String(other===button));});
window.chooseAction=chooseAction;window.seekPreview=seek;
window.artifactReady=chooseAction('react');
requestAnimationFrame(function tick(now){if(previous&&playing&&!document.hidden)elapsed+=(now-previous)*speed;previous=now;if(playing)draw();requestAnimationFrame(tick);});
</script></body></html>
