<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>滕环 · 角色动画预览</title>
<style>
:root{color-scheme:light;--paper:#faf7f1;--ink:#594236;--muted:#a18c7b;--line:#e6ddd2;--accent:#9b7962}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.5}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #c7a88a;outline-offset:3px}main{max-width:1100px;padding:44px 38px 24px;margin:auto}header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:25px}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--accent);margin:0 0 10px}h1{font:500 34px/1.3 "Songti SC",serif;letter-spacing:2px;margin:0 0 8px}.subtitle{margin:0;color:var(--muted);font-size:12px}.stamp{font-size:11px;border:1px solid var(--line);border-radius:30px;padding:8px 14px;white-space:nowrap}.workspace{display:grid;grid-template-columns:1.03fr 1fr;gap:40px;margin-top:26px}.stage{position:relative;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:22px;min-height:455px;overflow:hidden;background:radial-gradient(ellipse at center,#f5ece0,#fffcf8 72%)}.stage canvas{width:400px;height:400px;max-width:100%;object-fit:contain}.stage-label{position:absolute;left:19px;top:16px;color:#a08976;font-size:10px;letter-spacing:2px}.backgrounds{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:7px}button{color:var(--ink);border:1px solid var(--line);border-radius:8px;background:#fffcf8;padding:8px 12px;font-size:12px}.backgrounds button{padding:5px 10px;font-size:10px}.backgrounds [aria-pressed=true],[data-speed][aria-pressed=true]{background:#e9ddcf;border-color:#c5ad96}.stage.dark{background:#2e2d35}.stage.dark .stage-label{color:#d2c4b6}.stage.checker{background-color:#fff;background-image:linear-gradient(45deg,#e9e6e1 25%,transparent 25%),linear-gradient(-45deg,#e9e6e1 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e9e6e1 75%),linear-gradient(-45deg,transparent 75%,#e9e6e1 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.details{padding:9px 0}.section-label{font-size:10px;letter-spacing:2px;color:var(--muted);margin:0 0 14px}h2{font:500 24px "Songti SC",serif;margin:0 0 10px}.description{font-size:12px;color:#9a8371;min-height:43px;margin:0 0 20px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.actions button{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 3px 9px;min-width:0;background:#fffdfa;transition:background .15s,border-color .15s}.actions button img{width:78px;height:78px;object-fit:contain;max-width:100%}.actions [aria-pressed=true]{border-color:#b39376;background:#f0e7db}.actions span{font-size:10px;white-space:nowrap}.player{border-top:1px solid var(--line);margin-top:20px;padding-top:17px}.play-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}#play{background:var(--accent);color:white;border-color:var(--accent);min-width:64px}.speeds{display:flex;gap:4px;margin-left:auto}.speeds button{padding:6px 8px;font-size:10px}.scrub-row{display:flex;align-items:center;gap:10px;margin-top:15px}input[type=range]{accent-color:var(--accent);min-width:0;flex:1}.time{font:10px ui-monospace,monospace;color:var(--muted);white-space:nowrap}label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}input[type=checkbox]{accent-color:var(--accent)}.meta-row{display:flex;justify-content:space-between;gap:8px;margin-top:10px;align-items:center}.frame-info{font-size:10px;color:var(--muted)}#status{margin:12px 0 0;min-height:20px;font-size:11px;color:#9c8472}.footnote{display:flex;justify-content:space-between;gap:24px;border-top:1px solid var(--line);padding-top:19px;margin-top:26px;color:var(--muted);font-size:11px}.footnote p{margin:0}.links{display:flex;gap:18px;white-space:nowrap}a{color:#8e6c54;text-underline-offset:4px}@media(max-width:800px){main{padding:25px 18px}header{align-items:flex-start;gap:12px}h1{font-size:28px}.stamp{font-size:9px;padding:6px 9px}.workspace{grid-template-columns:1fr;gap:20px}.stage{min-height:390px}.stage canvas{width:350px;height:350px}.description{min-height:0}.actions{grid-template-columns:repeat(4,1fr)}.footnote{flex-direction:column;gap:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<header><div><p class="eyebrow">TENG HUAN · DESKTOP COMPANION</p><h1>陪你，把今天一点点完成。</h1><p class="subtitle">滕环 · 前端工程师 · 角色动画资源</p></div><span class="stamp">7 组动作 / 透明背景</span></header>
<section class="workspace" aria-label="动画播放器">
  <div class="stage" id="stage"><span class="stage-label">TENG HUAN / ORIGINAL OUTFIT</span><canvas id="pet" width="640" height="640" aria-label="滕环角色动画"></canvas><div class="backgrounds" role="group" aria-label="预览背景"><button data-bg="light" aria-pressed="true">浅色</button><button data-bg="dark" aria-pressed="false">深色</button><button data-bg="checker" aria-pressed="false">透明网格</button></div></div>
  <div class="details"><p class="section-label">CHOOSE A MOMENT</p><h2 id="action-title">正在载入</h2><p class="description" id="description"></p><nav class="actions" id="actions" aria-label="动作选择"></nav>
    <div class="player"><div class="play-row"><button id="play" disabled>暂停</button><button id="previous" aria-label="上一帧" disabled>←</button><button id="next" aria-label="下一帧" disabled>→</button><button id="restart" disabled>重播</button><div class="speeds" role="group" aria-label="播放速度"><button data-speed="0.25" aria-pressed="false">0.25×</button><button data-speed="0.5" aria-pressed="false">0.5×</button><button data-speed="1" aria-pressed="true">1×</button></div></div><div class="scrub-row"><input id="scrubber" type="range" min="0" max="1" value="0" aria-label="播放帧" disabled><span class="time" id="time">0.00 / 0.00 s</span></div><div class="meta-row"><span id="frame-info" class="frame-info"></span><label><input id="loop" type="checkbox" checked>循环预览</label></div></div>
    <p id="status" role="status" aria-live="polite">正在载入图像…</p>
  </div>
</section>
<footer class="footnote"><p>深棕短发、黑色长大衣、米色高领毛衣与浅色运动鞋。<br>可切换背景、慢放或逐帧查看，取消循环后按资源包的单次 / 循环设置播放。</p><div class="links"><a href="preview.png">动作总览</a><a href="README.md">资源说明</a><a href="manifest.json">动作配置</a></div></footer>
</main>
<!-- EMBEDDED_PACK_DATA -->
<script>
const {manifest,timelines,assets}=window.tengHuanPack;
const actionDetails={
  idle:{label:'待机眨眼',key:0,description:'安静呼吸，衣摆轻轻落定。偶尔眨眨眼，陪你慢慢做好眼前的事。'},
  react:{label:'挥手回应',key:8,description:'注意到你，弯起手肘轻轻招手，再回到放松的微笑。'},
  celebrate:{label:'鼓掌庆祝',key:13,description:'从期待到开心，轻轻拍两次手。每一个完成的小目标，都值得庆祝。'},
  all_done:{label:'跳跃欢呼',key:11,description:'轻轻蓄力，举起双手跳一下，再稳稳落地。今天的任务全部完成啦。'},
  remind:{label:'摇铃提醒',key:14,description:'举起小铃铛，轻摇两下，再摊开手温柔地提醒你看看接下来的安排。'},
  drink_water:{label:'喝水提醒',key:10,description:'拿起米色马克杯，喝一小口，再满足地放下。忙碌之间也照顾好自己。'},
  stretch:{label:'头顶伸展',key:10,description:'双手慢慢举过头顶，轻轻向两侧舒展，呼一口气，回到放松的姿态。'}
};
const canvas=document.getElementById('pet'),context=canvas.getContext('2d');
const scrubber=document.getElementById('scrubber'),playButton=document.getElementById('play');
const status=document.getElementById('status'),loopInput=document.getElementById('loop');
const imageCache=new Map();
let selected=null,image=null,elapsed=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,speed=1,previousTime=0,selectionVersion=0;
function loadImage(src){
  if(!imageCache.has(src))imageCache.set(src,new Promise((resolve,reject)=>{
    const value=new Image();value.onload=()=>resolve(value);value.onerror=()=>{imageCache.delete(src);reject(new Error('无法载入 '+src+'，请重新打开预览页。'));};value.src=assets[src];
  }));
  return imageCache.get(src);
}
function setPlaying(value){playing=value;playButton.textContent=value?'暂停':'播放';}
function draw(){
  if(!selected||!image)return;
  const state=manifest.states[selected],duration=state.frames/state.fps*1000;
  const looping=loopInput.checked||state.loop;
  if(!looping&&elapsed>=duration){elapsed=duration;setPlaying(false);}
  const position=looping?elapsed%duration:Math.min(elapsed,duration-0.001);
  const index=Math.min(state.frames-1,Math.floor(position*state.fps/1000));
  context.clearRect(0,0,canvas.width,canvas.height);
  context.drawImage(image,index%state.cols*320,Math.floor(index/state.cols)*320,320,320,0,0,canvas.width,canvas.height);
  scrubber.value=String(index);
  document.getElementById('time').textContent=(Math.min(position,duration)/1000).toFixed(2)+' / '+(duration/1000).toFixed(2)+' s';
  document.getElementById('frame-info').textContent='播放帧 '+(index+1)+' / '+state.frames+' · 绘制帧 '+(timelines[selected][index]+1)+' / 24';
}
async function chooseAction(id){
  if(!manifest.states[id])throw new Error('Unknown action: '+id);
  const request=++selectionVersion;
  status.textContent='正在载入图像…';
  try{
    const loaded=await loadImage(manifest.states[id].src);
    if(request!==selectionVersion)return;
    selected=id;image=loaded;elapsed=0;
    document.getElementById('action-title').textContent=actionDetails[id].label;
    document.getElementById('description').textContent=actionDetails[id].description;
    scrubber.max=String(manifest.states[id].frames-1);
    for(const button of document.querySelectorAll('[data-action]'))button.setAttribute('aria-pressed',String(button.dataset.action===id));
    for(const control of [playButton,scrubber,document.getElementById('previous'),document.getElementById('next'),document.getElementById('restart')])control.disabled=false;
    status.textContent='已载入 · '+(manifest.states[id].loop?'此动作默认循环播放':'此动作默认单次播放');
    setPlaying(!matchMedia('(prefers-reduced-motion: reduce)').matches);draw();
    return {id,width:loaded.width,height:loaded.height,frames:manifest.states[id].frames};
  }catch(error){
    if(request!==selectionVersion)return;
    status.textContent=error.message;
    throw error;
  }
}
function seek(index){
  if(!selected)return;
  setPlaying(false);
  elapsed=Math.max(0,Math.min(manifest.states[selected].frames-1,index))/manifest.states[selected].fps*1000+0.001;draw();
}
for(const [id,detail] of Object.entries(actionDetails)){
  const button=document.createElement('button');button.type='button';button.dataset.action=id;button.setAttribute('aria-pressed','false');
  const thumbnail=document.createElement('img');thumbnail.src=assets['keyframes/'+id+'/'+String(detail.key).padStart(2,'0')+'.png'];thumbnail.alt='';thumbnail.width=78;thumbnail.height=78;
  const label=document.createElement('span');label.textContent=detail.label;button.append(thumbnail,label);
  button.addEventListener('click',()=>{chooseAction(id).catch(()=>{});});document.getElementById('actions').append(button);
}
playButton.addEventListener('click',()=>{
  if(!selected)return;
  const duration=manifest.states[selected].frames/manifest.states[selected].fps*1000;
  if(!playing&&elapsed>=duration)elapsed=0;
  setPlaying(!playing);draw();
});
document.getElementById('restart').addEventListener('click',()=>{elapsed=0;setPlaying(true);draw();});
document.getElementById('previous').addEventListener('click',()=>seek(Number(scrubber.value)-1));
document.getElementById('next').addEventListener('click',()=>seek(Number(scrubber.value)+1));
scrubber.addEventListener('input',()=>seek(Number(scrubber.value)));
loopInput.addEventListener('change',()=>{if(selected){const state=manifest.states[selected];elapsed=elapsed%(state.frames/state.fps*1000);draw();}});
for(const button of document.querySelectorAll('[data-speed]'))button.addEventListener('click',()=>{speed=Number(button.dataset.speed);for(const other of document.querySelectorAll('[data-speed]'))other.setAttribute('aria-pressed',String(other===button));});
for(const button of document.querySelectorAll('[data-bg]'))button.addEventListener('click',()=>{document.getElementById('stage').className='stage '+button.dataset.bg;for(const other of document.querySelectorAll('[data-bg]'))other.setAttribute('aria-pressed',String(other===button));});
for(const link of document.querySelectorAll('.links a')){const path=link.getAttribute('href');link.href=assets[path];link.download=path;}
document.addEventListener('visibilitychange',()=>{previousTime=0;});
window.chooseAction=chooseAction;window.seekPreview=seek;
window.artifactReady=chooseAction('remind');window.artifactReady.catch(()=>{});
requestAnimationFrame(function tick(now){if(previousTime&&playing&&!document.hidden)elapsed+=(now-previousTime)*speed;previousTime=now;if(playing)draw();requestAnimationFrame(tick);});
</script>
</body>
</html>
