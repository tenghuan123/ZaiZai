appId: com.desktopbuddy.m0
productName: zaizai
directories:
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**/*
extraResources:
  - from: resources/tray
    to: tray
mac:
  icon: resources/branding/zaizai.icns
  category: public.app-category.productivity
  target:
    - target: dir
      arch: [arm64]
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
win:
  icon: resources/branding/zaizai.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
